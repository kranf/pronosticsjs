services:
  mongodb:
    image: mongo:latest
    ports: 
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  
  mysqldb:
    image: mysql:8
    environment:
      MYSQL_DATABASE: $DB_NAME
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
      MYSQL_USER: $MYSQL_USER
      MYSQL_PASSWORD: $MYSQL_PASSWORD
    ports: 
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mongo-data:
  mysql-data:
